<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173f42">
  <meta name="description" content="Chloe's offline Chinese learning game for Lessons 01 and 02.">
  <title>Chloe's Chinese Quest</title>
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
  <div class="page-shade" aria-hidden="true"></div>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button id="homeButton" class="brand-button" type="button" aria-label="Return to welcome screen">
        <span class="brand-mark" aria-hidden="true">C</span>
        <span>
          <strong>Chloe's Chinese Quest</strong>
          <small>Lessons 01 + 02</small>
        </span>
      </button>
      <div id="headerProgress" class="header-progress" hidden>
        <span id="headerLevel">Level 1</span>
        <div class="progress-track" aria-hidden="true"><span id="progressFill"></span></div>
        <span id="headerCount">1 / 20</span>
      </div>
    </header>

    <main id="screen" class="screen" tabindex="-1"></main>
  </div>

  <div id="dragLayer" class="drag-layer" aria-hidden="true"></div>
  <script src="app.js?v=2"></script>
</body>
</html>
